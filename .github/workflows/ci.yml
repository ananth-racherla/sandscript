name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify checked-in WASM matches Rust source
        run: |
          expected=$(cat frontend/src/wasm-source.sha256)
          actual=$(./scripts/hash-rust-source.sh)
          if [ "$expected" != "$actual" ]; then
            echo "::error::frontend/src/wasm/ is out of date with the Rust source in src/. Run 'npm run wasm:build' in frontend/ and commit the result (including frontend/src/wasm-source.sha256)."
            exit 1
          fi
          echo "Checked-in WASM matches current Rust source ($actual)."

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint
